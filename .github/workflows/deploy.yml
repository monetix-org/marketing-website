name: Deploy landing

on:
  push:
    branches: [develop, main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: deploy-${{ github.ref_name }}
  cancel-in-progress: true

jobs:
  deploy-dev:
    name: Publicar en dev.monetix.mx
    if: github.ref_name == 'develop'
    runs-on: ubuntu-latest
    environment:
      name: dev
      url: https://dev.monetix.mx
    steps:
      - uses: actions/checkout@v5

      - name: Deploy a Cloudflare Workers (env dev)
        uses: cloudflare/wrangler-action@v3
        with:
          wranglerVersion: "4.158.0"
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: deploy --env dev

  deploy-prod:
    name: Publicar en monetix.mx
    # Candado: produccion solo se publica si la variable del repo PROD_ENABLED vale "true".
    # Se activa el dia del corte, cuando el portal ya viva en portal.monetix.mx.
    if: github.ref_name == 'main' && vars.PROD_ENABLED == 'true'
    runs-on: ubuntu-latest
    environment:
      name: production
      url: https://monetix.mx
    steps:
      - uses: actions/checkout@v5

      - name: Deploy a Cloudflare Workers (env production)
        uses: cloudflare/wrangler-action@v3
        with:
          wranglerVersion: "4.158.0"
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: deploy --env production